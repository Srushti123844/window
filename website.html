<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Simple Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      color: #333;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Simple Website</h1>
  <p>This is a basic webpage using HTML, CSS, and JavaScript.</p>
  <button onclick="sayHello()">Click Me!</button>

  <script>
    function sayHello() {
      alert("Hello! Thanks for visiting.");
    }
  </script>

</body>
</html>
